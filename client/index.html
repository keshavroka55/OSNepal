  <!-- Structured data: helps Google understand what the site is -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Open Source Nepal",
      "url": "https://osnepal.keshavroka.com.np/",
      "description": "Nepal's community for student developers, open-source contributors, designers and early founders to share projects, find teammates and build a portfolio of real work.",
      "inLanguage": "en",
      "publisher": {
        "@type": "Organization",
        "name": "Open Source Nepal",
        "areaServed": "NP",
        "logo": "https://osnepal.keshavroka.com.np/oslogo.png"
      }
    }
  </script>

  <!-- Runs before first paint so the page never flashes the wrong theme.
       Keep the storage key in sync with ThemeContext.tsx. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('msa-theme');
        var choice = stored === 'light' || stored === 'dark' ? stored : 'system';
        var dark = choice === 'dark' ||
          (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0e1014' : '#f6f7f9');
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
