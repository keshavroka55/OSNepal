
services:
  api:
    image: os-nepal-api:${IMAGE_TAG:-latest}
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: os-nepal-api
    restart: always
    env_file:
      - ./back-end/.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    ports:
      - "8003:8000"
    volumes:
      - /opt/os-nepal/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:8000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - os-nepal-net

  db:
    image: postgres:16-alpine
    container_name: os-nepal-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - os-nepal-net

  redis:
    image: redis:7-alpine
    container_name: os-nepal-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - os-nepal-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  os-nepal-net:
    driver: bridge
